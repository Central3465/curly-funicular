<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Version - Cypher Encoder & Decoder</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <p>
      <a id="commit" href="#" target="_blank">Loading...</a>
    </p>

    <script>
      fetch(
        "https://api.github.com/repos/Central3465/curly-funicular/commits?per_page=1",
      )
        .then((response) => response.json())
        .then((data) => {
          const commit = data[0];

          const commitLink = document.getElementById("commit");

          commitLink.textContent = commit.sha.substring(0, 7);
          commitLink.href = commit.html_url;
        })
        .catch(() => {
          document.getElementById("commit").textContent = "Unavailable";
        });
    </script>
  </body>
</html>
