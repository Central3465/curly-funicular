<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Goodbye - Cipher App</title>
    <style>
        :root {
            --bg-primary: #faf7f2;
            --bg-secondary: #ffffff;
            --text-primary: #1e1e1e;
            --text-secondary: #5a4a3a;
            --border-color: #e0d6cc;
            --primary-color: #d9730d;
            --primary-hover: #b35f00;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #1a1a1a;
                --bg-secondary: #2d2d2d;
                --text-primary: #e8e8e8;
                --text-secondary: #b8b8b8;
                --border-color: #404040;
                --primary-color: #e8a540;
                --primary-hover: #f0b656;
            }
        }

        :root[data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #e8e8e8;
            --text-secondary: #b8b8b8;
            --border-color: #404040;
            --primary-color: #e8a540;
            --primary-hover: #f0b656;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .goodbye-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px 24px;
            text-align: center;
        }

        .goodbye-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .goodbye-card h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 12px;
        }

        .goodbye-card p {
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .goodbye-card {
                padding: 28px 16px;
            }

            .goodbye-card h1 {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>
    <main class="goodbye-card">
        <div class="goodbye-icon" aria-hidden="true">👋</div>
        <h1>Goodbye</h1>
        <p>You account has been deleted. Thanks for using Curly Funicular.</p>
        <a href="/register" class="btn btn-primary">Change your mind?</a>
    </main>
</body>
</html>
