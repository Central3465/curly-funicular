<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Email Verification - Cipher App</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <style>
      .verify-container {
        max-width: 500px;
        margin: 100px auto;
        padding: 40px;
        background: var(--bg-secondary);
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .verify-container h2 {
        margin-bottom: 20px;
      }
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 30px 0;
      }
      .spinner {
        border: 4px solid var(--border-color);
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .success-message {
        display: none;
        padding: 20px;
        background: #d4edda;
        border: 1px solid #c3e6cb;
        border-radius: 5px;
        color: #155724;
        margin: 20px 0;
      }
      .success-message.show {
        display: block;
      }
      .error-message {
        display: none;
        padding: 20px;
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 5px;
        color: #721c24;
        margin: 20px 0;
      }
      .error-message.show {
        display: block;
      }
      .auth-link {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
      }
      .auth-link a {
        color: var(--primary-color);
        text-decoration: none;
      }
      .auth-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="verify-container">
      <h2>🔐 Verifying Email</h2>

      <div class="loading" id="loadingSpinner">
        <div class="spinner"></div>
      </div>

      <div class="success-message" id="successMessage">
        <strong>Success!</strong> Your email has been verified. You can now log in to your account.
      </div>

      <div class="error-message" id="errorMessage"></div>

      <div class="auth-link" id="authLink" style="display: none;">
        <a href="/login">Return to Login</a>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('loadingSpinner').style.display = 'none';
        document.getElementById('errorMessage').textContent = 'No verification token provided.';
        document.getElementById('errorMessage').classList.add('show');
        document.getElementById('authLink').style.display = 'block';
      } else {
        fetch('/api/verify-email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ token }),
        })
          .then(response => response.json())
          .then(data => {
            document.getElementById('loadingSpinner').style.display = 'none';

            if (data.success) {
              document.getElementById('successMessage').classList.add('show');
              document.getElementById('authLink').style.display = 'block';
              setTimeout(() => {
                window.location.href = '/login';
              }, 3000);
            } else {
              document.getElementById('errorMessage').textContent = data.error || 'Failed to verify email.';
              document.getElementById('errorMessage').classList.add('show');
              document.getElementById('authLink').style.display = 'block';
            }
          })
          .catch(error => {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('errorMessage').textContent = 'An error occurred. Please try again.';
            document.getElementById('errorMessage').classList.add('show');
            document.getElementById('authLink').style.display = 'block';
            console.error('Error:', error);
          });
      }
    </script>
  </body>
</html>
