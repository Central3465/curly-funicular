<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Account Settings - Cipher App</title>
    <style>
        :root {
            --bg-primary: #faf7f2;
            --bg-secondary: #ffffff;
            --text-primary: #1e1e1e;
            --text-secondary: #5a4a3a;
            --border-color: #e0d6cc;
            --primary-color: #d9730d;
            --primary-hover: #b35f00;
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 16px;
        }

        .settings-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .settings-container h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .nav-header {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            gap: 10px;
        }

        .nav-header h2 {
            text-align: left;
            margin-bottom: 0;
            font-size: 1.5rem;
        }

        .nav-header a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .nav-header a:hover {
            text-decoration: underline;
            color: var(--primary-color);
        }

        .error-message {
            background: var(--error-color);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .success-message {
            background: var(--success-color);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .user-info {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .user-info p {
            margin: 12px 0;
            font-size: 0.95rem;
            line-height: 1.5;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-info strong {
            color: var(--primary-color);
            display: inline-block;
            min-width: 140px;
            font-weight: 600;
        }

        .usage-limits-section {
            background: var(--bg-primary);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .usage-limits-section h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .limit-item {
            margin-bottom: 24px;
        }

        .limit-item:last-child {
            margin-bottom: 0;
        }

        .limit-label {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 8px;
            font-size: 0.9rem;
            gap: 6px;
        }

        .limit-label strong {
            color: var(--primary-color);
            font-weight: 600;
        }

        .limit-stats {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .progress-bar {
            width: 100%;
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            transition: width 0.3s ease;
            min-width: 30px;
        }

        .progress-fill.warning {
            background: #e07b1a;
        }

        .progress-fill.danger {
            background: #c45a00;
        }

        .reset-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
            min-width: 60px;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-danger {
            background: var(--error-color);
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            .settings-container {
                margin: 10px;
                padding: 15px;
            }

            .settings-container h2,
            .nav-header h2 {
                font-size: 1.25rem;
                margin-bottom: 15px;
            }

            .nav-header {
                flex-direction: column;
            }

            .nav-header a {
                font-size: 0.85rem;
            }

            .user-info {
                padding: 15px;
            }

            .user-info p {
                font-size: 0.9rem;
                flex-direction: column;
                gap: 2px;
            }

            .user-info strong {
                min-width: auto;
                display: block;
            }

            .usage-limits-section {
                padding: 15px;
            }

            .btn {
                padding: 12px 16px;
                font-size: 13px;
                min-width: 70px;
                display: block;
                width: 100%;
                margin-bottom: 10px;
            }

            .btn:last-child {
                margin-bottom: 0;
            }
        }

        @media (max-width: 480px) {
            .limit-label {
                flex-direction: column;
                gap: 2px;
            }

            .progress-bar {
                height: 20px;
            }

            .progress-fill {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="nav-header">
            <h2>⚙️ Account Settings</h2>
            <a href="/">← Back to App</a>
        </div>
        
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
        
        <div id="loading" class="loading">Loading your account information...</div>
        
        <div id="user-info-section" style="display: none;">
            <div class="user-info">
                <p><strong>Email:</strong> <span id="user-email"></span></p>
                <p><strong>Account Created:</strong> <span id="user-created-at"></span></p>
                <p><strong>Account Tier:</strong> <span id="user-tier"></span></p>
                <p><strong>Status:</strong> <span id="user-status"></span></p>
            </div>

            <div class="usage-limits-section">
                <h3>Usage Limits</h3>

                <div class="limit-item">
                    <div class="limit-label">
                        <strong>Session Limit (5 hours)</strong>
                        <span class="limit-stats"><span id="session-count">0</span>/<span id="session-max">100</span></span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="session-bar" style="width: 0%">
                            <span id="session-percentage">0%</span>
                        </div>
                    </div>
                    <div class="reset-time" id="session-reset-time"></div>
                </div>

                <div class="limit-item">
                    <div class="limit-label">
                        <strong>Weekly Limit</strong>
                        <span class="limit-stats"><span id="weekly-count">0</span>/<span id="weekly-max">500</span></span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="weekly-bar" style="width: 0%">
                            <span id="weekly-percentage">0%</span>
                        </div>
                    </div>
                    <div class="reset-time" id="weekly-reset-time"></div>
                </div>
            </div>

            <button id="logout-btn" class="btn btn-danger">Log Out</button>
        </div>
    </div>

    <script>
        let csrfToken = null;

        async function fetchCSRFToken() {
            try {
                const response = await fetch('/api/csrf-token');
                const data = await response.json();
                csrfToken = data.csrf_token;
            } catch (error) {
                console.error('Failed to fetch CSRF token:', error);
            }
        }

        function getHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (csrfToken) {
                headers['X-CSRFToken'] = csrfToken;
            }
            return headers;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString();
        }

        function getTimeRemaining(resetAtISO) {
            const resetAt = new Date(resetAtISO);
            const now = new Date();
            const diff = resetAt - now;

            if (diff <= 0) return 'Resetting soon...';

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));

            if (days > 0) {
                return `Resets in ${days}d ${hours}h ${minutes}m`;
            } else if (hours > 0) {
                return `Resets in ${hours}h ${minutes}m`;
            } else {
                return `Resets in ${minutes}m`;
            }
        }

        async function loadUsageLimits() {
            try {
                const response = await fetch('/api/usage-limits');

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                if (!response.ok) {
                    console.error('Failed to load usage limits');
                    return;
                }

                const data = await response.json();

                const sessionLimit = data.session_limit;
                const weeklyLimit = data.weekly_limit;

                document.getElementById('session-count').textContent = sessionLimit.current;
                document.getElementById('session-max').textContent = sessionLimit.max;
                document.getElementById('session-percentage').textContent = sessionLimit.percentage + '%';

                const sessionBar = document.getElementById('session-bar');
                sessionBar.style.width = Math.max(2, sessionLimit.percentage) + '%';
                if (sessionLimit.percentage > 0) {
                    sessionBar.textContent = sessionLimit.percentage + '%';
                }

                if (sessionLimit.percentage >= 90) {
                    sessionBar.classList.add('danger');
                } else if (sessionLimit.percentage >= 70) {
                    sessionBar.classList.add('warning');
                }

                document.getElementById('session-reset-time').textContent = getTimeRemaining(sessionLimit.reset_at);

                document.getElementById('weekly-count').textContent = weeklyLimit.current;
                document.getElementById('weekly-max').textContent = weeklyLimit.max;
                document.getElementById('weekly-percentage').textContent = weeklyLimit.percentage + '%';

                const weeklyBar = document.getElementById('weekly-bar');
                weeklyBar.style.width = Math.max(2, weeklyLimit.percentage) + '%';
                if (weeklyLimit.percentage > 0) {
                    weeklyBar.textContent = weeklyLimit.percentage + '%';
                }

                if (weeklyLimit.percentage >= 90) {
                    weeklyBar.classList.add('danger');
                } else if (weeklyLimit.percentage >= 70) {
                    weeklyBar.classList.add('warning');
                }

                document.getElementById('weekly-reset-time').textContent = getTimeRemaining(weeklyLimit.reset_at);
            } catch (error) {
                console.error('Error loading usage limits:', error);
            }
        }

        async function loadUserData() {
            try {
                const response = await fetch('/api/user-data');

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('user-info-section').style.display = 'block';
                document.getElementById('user-email').textContent = data.email;
                document.getElementById('user-created-at').textContent = data.created_at;
                document.getElementById('user-tier').textContent = data.tier_name || 'Unknown';

                const statusSpan = document.getElementById('user-status');
                if (data.banned) {
                    statusSpan.textContent = 'Banned ⚠️';
                    statusSpan.style.color = 'var(--error-color)';
                } else {
                    statusSpan.textContent = 'Active ✓';
                    statusSpan.style.color = 'var(--success-color)';
                }

                await loadUsageLimits();
            } catch (error) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = 'Error loading user data: ' + error.message;
                errorDiv.style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        document.getElementById('logout-btn').addEventListener('click', async function() {
            try {
                await fetch('/api/logout', { method: 'POST', headers: getHeaders() });
                window.location.href = '/login';
            } catch (error) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = 'Error logging out: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        // Load user data on page load
        window.addEventListener('load', fetchCSRFToken);
        loadUserData();
    </script>
</body>
</html>
